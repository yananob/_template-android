name: Android Build & Release (release)
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aab_path:
        description: 'Path to the AAB file'
        required: true
        default: 'app/build/outputs/bundle/release/app-release.aab'

concurrency:
  group: {{VALUES_APP_NAME}}-build-release
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/android-build.yml
    with:
      build_type: 'release'
      aab_path: ${{ inputs.aab_path || 'app/build/outputs/bundle/release/app-release.aab' }}
      package_name: 'io.github.yananob.{{VALUES_APP_NAME}}'
    secrets:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
